name: Korea Stock Hunter

on:
  schedule:
    - cron: '30 22 * * 1-5' # 예시 스케줄 (필요에 맞게 조정)
  workflow_dispatch:
    inputs:
      MODE:
        description: '실행 모드'
        required: true
        default: 'monitor'
        type: string
      FORCE_SCAN:
        description: '강제 실행'
        required: true
        default: true
        type: boolean

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.MODE || 'monitor' }}
          FORCE_SCAN: ${{ github.event.inputs.FORCE_SCAN || 'true' }}
        run: |
          python main.py

      - name: Pull latest changes before commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "No rebase needed or handled"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: active_positions.json
          commit_message: "Update Korea Stock Hunter state [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
