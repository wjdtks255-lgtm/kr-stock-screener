name: Public Stock Signal Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [stock-scan]
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/stock_hunter.yml"

permissions:
  contents: write

concurrency:
  group: public-stock-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Run stock scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          STOCK_MAX_POSITIONS: "8"
          KIS_MAX_SYMBOLS: "40"
          STOCK_MIN_PRICE_KRW: "1000"
          STOCK_MAX_PRICE_KRW: "50000"
          STOCK_MIN_OPEN_GAIN_PCT: "0.40"
          STOCK_MIN_VOLUME_SURGE: "1.50"
          TZ: Asia/Seoul
        run: python -u main.py

      - name: Save signal state
        if: always()
        run: |
          if [ -f stock_intraday_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock_intraday_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update stock signal state [skip ci]"
              git push
            else
              echo "State unchanged."
            fi
          elif [ -f active_positions.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add active_positions.json
            if ! git diff --cached --quiet; then
              git commit -m "Update stock signal state [skip ci]"
              git push
            else
              echo "State unchanged."
            fi
          else
            echo "State file not created; nothing to save."
          fi
