name: Korea Stock Hunter V3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "monitor"
        type: choice
        options:
          - morning
          - close
          - monitor

      force_scan:
        description: "Force scan"
        required: true
        default: false
        type: boolean

  # ==========================================
  # 장초
  # 09:05 ~ 09:30
  # ==========================================
  schedule:
    - cron: "5,10,15,20,25,30 9 * * 1-5"
      timezone: "Asia/Seoul"

    # ==========================================
    # 종가 후보
    # 15:10 / 15:15 / 15:20
    # ==========================================
    - cron: "10,15,20 15 * * 1-5"
      timezone: "Asia/Seoul"

    # ==========================================
    # 장중 포지션 모니터
    # ==========================================
    - cron: "35,40,45,50,55 9 * * 1-5"
      timezone: "Asia/Seoul"

    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 10,11,12,13,14 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: korea-stock-hunter
  cancel-in-progress: false

jobs:

  run:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml

      # ==========================================
      # RUN BOT
      # ==========================================
      - name: Run stock hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

          MODE: ${{ github.event.inputs.mode }}

          FORCE_SCAN: ${{ github.event.inputs.force_scan }}

        run: |
          python main.py

      # ==========================================
      # SAVE STATE
      # ==========================================
      - name: Commit bot state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stock hunter state"
          file_pattern: bot_state.json
