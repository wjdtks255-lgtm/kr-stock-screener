name: Korea Stock Hunter V5.3

on:
  workflow_dispatch:
  schedule:
    # 1. 오전 09:05 KST (00:05 UTC) - 시초가 갭 공략 탐색
    - cron: '5 0 * * 1-5'
    # 2. 오후 15:15 KST (06:15 UTC) - 15시 20분 동시호가 진입 전 종가베팅 종목 탐색
    - cron: '15 6 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests pandas finance-datareader pytz

    - name: Run Stock Hunter
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python main.py
