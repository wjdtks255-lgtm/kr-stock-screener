name: Korea Stock Hunter

on:
  schedule:
    - cron: '5,10,15,20,25,30 0 * * 1-5'
    - cron: '35,40,45,50,55 0 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 1,2,3,4,5 * * 1-5'
    - cron: '0,5 6 * * 1-5'
    - cron: '10,15,20 6 * * 1-5'

  workflow_dispatch:
    inputs:
      MODE:
        description: '실행 모드'
        required: true
        default: 'Intraday'
        type: choice
        options:
          - Morning
          - Intraday
          - Close
          - Monitor
      FORCE_SCAN:
        description: '강제 스캔'
        required: true
        default: true
        type: boolean

concurrency:
  group: korea-stock-hunter
  cancel-in-progress: false

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN" || {
            echo "ERROR: TELEGRAM_TOKEN 없음"
            exit 1
          }
          test -n "$TELEGRAM_CHAT_ID" || {
            echo "ERROR: CHAT_ID 없음"
            exit 1
          }
          echo "Telegram secrets OK"

      - name: Run Stock Hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.MODE || '' }}
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_SCAN || '' }}
        run: |
          echo "===================================="
          echo " KOREA STOCK HUNTER"
          echo "===================================="
          echo "Event : ${{ github.event_name }}"
          echo "Mode  : $MODE"
          echo "Force : $FORCE_SCAN"
          echo "===================================="
          python main.py

      - name: Commit State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: active_positions.json
          commit_message: "Update Korea Stock Hunter state [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
