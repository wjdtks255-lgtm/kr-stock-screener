name: Korea Stock Hunter

concurrency:
  group: korea-stock-hunter
  cancel-in-progress: true # 멈춰 있는 이전 작업이 있으면 자동 취소하고 새 작업 실행

on:
  schedule:
    - cron: '*/15 * * * 1-5' # 평일 15분 간격 실행
  workflow_dispatch:
    inputs:
      MODE:
        description: '실행 모드 (morning, intraday, close, monitor 중 선택)'
        required: true
        default: 'monitor'
        type: string
      FORCE_SCAN:
        description: '강제 실행 여부'
        required: true
        default: true
        type: boolean

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 10분이 지나도 끝나지 않으면 강제 종료하여 무한 대기 방지
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Hunter
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.MODE || 'monitor' }}
          FORCE_SCAN: ${{ github.event.inputs.FORCE_SCAN || 'true' }}
        run: |
          python main.py

      - name: Pull latest changes before commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || echo "No rebase needed"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: active_positions.json
          commit_message: "Update Korea Stock Hunter state [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
