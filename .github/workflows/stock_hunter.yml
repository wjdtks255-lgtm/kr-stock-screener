name: Korea Stock Screener Bot

on:
  repository_dispatch:
    types: [run-screener]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests finance-datareader

      - name: Run Screener Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      # 🌟 중요: active_positions.json 파일 자동 커밋 및 푸시 스크립트
      - name: Commit and push position state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add active_positions.json
          git commit -m "Auto-update active_positions.json [skip ci]" || echo "No changes to commit"
          git push
