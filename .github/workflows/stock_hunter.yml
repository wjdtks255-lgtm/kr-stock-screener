name: Korea Stock Hunter Bot (Cron-job.org Trigger)

on:
  repository_dispatch:
    types: [run-bot]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: run-bot-lock
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests FinanceDataReader

      - name: Run Main Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and Push state changes (active_positions.json)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update position states and stats [skip ci]"
          branch: main
