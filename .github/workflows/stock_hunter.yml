name: Korea Stock Hunter V6

on:

  # ==========================================
  # GitHub 웹에서 수동 실행
  # ==========================================

  workflow_dispatch:

    inputs:

      mode:
        description: "실행 모드"
        required: true
        default: "monitor"

        type: choice

        options:
          - morning
          - intraday
          - close
          - monitor

      force_scan:
        description: "강제 실행"
        required: true
        default: true
        type: boolean


  # ==========================================
  # 자동 실행
  # ==========================================

  schedule:

    # ------------------------------------------
    # 09:05 ~ 09:30
    # 시초 상승 후보
    # KST 09:05 = UTC 00:05
    # ------------------------------------------

    - cron: '5,10,15,20,25,30 0 * * 1-5'


    # ------------------------------------------
    # 09:35 ~ 09:55
    # 장초 상승 후보
    # ------------------------------------------

    - cron: '35,40,45,50,55 0 * * 1-5'


    # ------------------------------------------
    # 10:00 ~ 14:55
    # 장중 상승 후보
    # 5분마다
    # ------------------------------------------

    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 1,2,3,4,5 * * 1-5'


    # ------------------------------------------
    # 15:00 ~ 15:05
    # 마지막 장중 확인
    # ------------------------------------------

    - cron: '0,5 6 * * 1-5'


    # ------------------------------------------
    # 15:10 / 15:15 / 15:20
    # 종가 후보
    # ------------------------------------------

    - cron: '10,15,20 6 * * 1-5'


# ==========================================
# GitHub 권한
# ==========================================

permissions:
  contents: write


# ==========================================
# 중복 실행 방지
# ==========================================

concurrency:

  group: korea-stock-hunter-v6

  cancel-in-progress: false


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 20


    steps:

    # ======================================
    # 1. Repository Checkout
    # ======================================

    - name: Checkout repository

      uses: actions/checkout@v4


    # ======================================
    # 2. Python
    # ======================================

    - name: Set up Python

      uses: actions/setup-python@v5

      with:
        python-version: '3.11'


    # ======================================
    # 3. Dependencies
    # ======================================

    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        python -m pip install \
          requests \
          pandas \
          numpy \
          pytz \
          lxml \
          finance-datareader


    # ======================================
    # 4. 설치 확인
    # ======================================

    - name: Verify dependencies

      run: |

        python -c "import requests; print('requests OK')"

        python -c "import pandas; print('pandas OK')"

        python -c "import numpy; print('numpy OK')"

        python -c "import pytz; print('pytz OK')"

        python -c "import FinanceDataReader as fdr; print('FinanceDataReader OK')"


    # ======================================
    # 5. Stock Hunter 실행
    # ======================================

    - name: Run Stock Hunter

      env:

        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

        CHAT_ID: ${{ secrets.CHAT_ID }}

        MODE: ${{ github.event.inputs.mode }}

        FORCE_SCAN: ${{ github.event.inputs.force_scan }}

      run: |

        python main.py


    # ======================================
    # 6. 포지션 상태 저장
    # ======================================

    - name: Save position state

      uses: stefanzweifel/git-auto-commit-action@v5

      with:

        commit_message: "Update Korea Stock Hunter V6 state"

        file_pattern: active_positions.json
