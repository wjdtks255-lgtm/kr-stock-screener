name: Korea Stock Hunter Bot (Cron-job.org Trigger)

on:
  repository_dispatch:
    types: [run-bot]
  workflow_dispatch:      # 깃허브 웹에서 수동으로도 즉시 실행 가능

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy finance-datareader requests

      - name: Run Main Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and Push state changes (active_positions.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_positions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update position stats [skip ci]" && git push)
