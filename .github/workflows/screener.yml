name: Stock Auto Trading Bot

on:
  schedule:
    # UTC 기준 오전 6시 0분 = 한국 시간 평일 오후 3시 0분 실행 (연산 시간 고려하여 15~20분경 전송)
    - cron: '0 6 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader pandas requests
          python main.py

      - name: Commit and push updated active positions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update active_positions.json"
          file_patterns: active_positions.json
