name: K-Stock Closing Screener

on:
  schedule:
    # 매주 월~금 한국 시간 오후 3시 40분 (UTC 06:40) 실행
    - cron: '40 6 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 여기가 핵심 수정 포인트입니다! (pip 업그레이드 추가)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests FinanceDataReader

      - name: Run screener and tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Save active positions to repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update active positions tracking state"
          file_pattern: active_positions.json
