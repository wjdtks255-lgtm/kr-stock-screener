name: K-Stock Closing Screener

on:
  schedule:
    # 평일 오전 9시 ~ 오후 3시 30분 (UTC 기준 00:00 ~ 06:30) 사이 5분마다 실행
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests finance-datareader

      - name: Run screener and tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Save active positions to repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update active positions tracking state"
          file_pattern: active_positions.json
